<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Elegant Metallic Rose Gold Wire Gradient -->
    <linearGradient id="roseGoldWire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8b19d"/>
      <stop offset="25%" stop-color="#fff0ea"/>
      <stop offset="50%" stop-color="#cca18f"/>
      <stop offset="75%" stop-color="#fad0c4"/>
      <stop offset="100%" stop-color="#996e5d"/>
    </linearGradient>

    <!-- Sunset Mirrored Lens Gradient (Pink, Rose, and Warm Gold Highlights) -->
    <linearGradient id="sunsetMirror" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b85252"/>
      <stop offset="35%" stop-color="#df6d75"/>
      <stop offset="70%" stop-color="#f4a29a"/>
      <stop offset="90%" stop-color="#fbc5b3"/>
      <stop offset="100%" stop-color="#ffe3cc"/>
    </linearGradient>
    
    <!-- Horizon Glow Accent Overlay for the Mirror Lenses -->
    <linearGradient id="horizonGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="75%" stop-color="#ff9a9e" stop-opacity="0"/>
      <stop offset="100%" stop-color="#fecfef" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- Background (Optional/Transparent) -->
  <rect width="100%" height="100%" fill="none"/>

  <g transform="translate(0, 15)">
    <!-- BACKGROUND SLENDER TEMPLES / ARMS -->
    <!-- Left Wire Arm -->
    <path d="M 142 220 C 185 224, 205 245, 230 275" fill="none" stroke="#a87f70" stroke-width="2" stroke-linecap="round"/>
    <!-- Right Wire Arm -->
    <path d="M 658 220 C 615 224, 595 245, 570 275" fill="none" stroke="#a87f70" stroke-width="2" stroke-linecap="round"/>

    <!-- DETAILED TEXTURED BRIDGE -->
    <path d="M 374 216 C 388 206, 412 206, 426 216" fill="none" stroke="url(#roseGoldWire)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Center ridge pattern texture mimic -->
    <path d="M 382 212 C 392 207, 408 207, 418 212" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="2,2" opacity="0.5"/>

    <!-- LEFT EYE (Soft Rounded Rectangle/Aviator Profile) -->
    <g id="leftEye">
      <!-- Sunset Mirrored Lens -->
      <path d="
        M 175 175 
        C 235 170, 315 170, 355 182
        C 372 187, 374 205, 372 232
        C 368 285, 350 322, 315 324
        C 265 326, 185 326, 145 314
        C 128 310, 126 285, 128 232
        C 130 195, 140 177, 175 175 Z" 
        fill="url(#sunsetMirror)"
      />
      <!-- Mirror Horizon Reflective Layer -->
      <path d="
        M 175 175 
        C 235 170, 315 170, 355 182
        C 372 187, 374 205, 372 232
        C 368 285, 350 322, 315 324
        C 265 326, 185 326, 145 314
        C 128 310, 126 285, 128 232
        C 130 195, 140 177, 175 175 Z" 
        fill="url(#horizonGlow)"
      />
      <!-- Fine Rose Gold Wire Outline -->
      <path d="
        M 175 175 
        C 235 170, 315 170, 355 182
        C 372 187, 374 205, 372 232
        C 368 285, 350 322, 315 324
        C 265 326, 185 326, 145 314
        C 128 310, 126 285, 128 232
        C 130 195, 140 177, 175 175 Z" 
        fill="none" 
        stroke="url(#roseGoldWire)" 
        stroke-width="3" 
        stroke-linejoin="round"
      />
    </g>

    <!-- RIGHT EYE (Mirrored Soft Rounded Rectangle) -->
    <g id="rightEye">
      <!-- Sunset Mirrored Lens -->
      <path d="
        M 625 175 
        C 565 170, 485 170, 445 182
        C 428 187, 426 205, 428 232
        C 432 285, 450 322, 485 324
        C 535 326, 615 326, 655 314
        C 672 310, 674 285, 672 232
        C 670 195, 660 177, 625 175 Z" 
        fill="url(#sunsetMirror)"
      />
      <!-- Mirror Horizon Reflective Layer -->
      <path d="
        M 625 175 
        C 565 170, 485 170, 445 182
        C 428 187, 426 205, 428 232
        C 432 285, 450 322, 485 324
        C 535 326, 615 326, 655 314
        C 672 310, 674 285, 672 232
        C 670 195, 660 177, 625 175 Z" 
        fill="url(#horizonGlow)"
      />
      <!-- Fine Rose Gold Wire Outline -->
      <path d="
        M 625 175 
        C 565 170, 485 170, 445 182
        C 428 187, 426 205, 428 232
        C 432 285, 450 322, 485 324
        C 535 326, 615 326, 655 314
        C 672 310, 674 285, 672 232
        C 670 195, 660 177, 625 175 Z" 
        fill="none" 
        stroke="url(#roseGoldWire)" 
        stroke-width="3" 
        stroke-linejoin="round"
      />
    </g>

    <!-- CLEAR SILICONE NOSE PADS WITH ROSE GOLD MOUNTS -->
    <!-- Left Pad -->
    <path d="M 364 242 C 360 242, 356 250, 358 260" fill="none" stroke="url(#roseGoldWire)" stroke-width="2"/>
    <ellipse cx="358" cy="256" rx="3.5" ry="7" fill="#ffffff" fill-opacity="0.4" transform="rotate(-10, 358, 256)"/>
    <!-- Right Pad -->
    <path d="M 436 242 C 440 242, 444 250, 442 260" fill="none" stroke="url(#roseGoldWire)" stroke-width="2"/>
    <ellipse cx="442" cy="256" rx="3.5" ry="7" fill="#ffffff" fill-opacity="0.4" transform="rotate(10, 442, 256)"/>

    <!-- MINIMALIST PROFILE ENDPIECES / HINGES -->
    <!-- Left Side Connection -->
    <line x1="128" y1="222" x2="110" y2="224" stroke="url(#roseGoldWire)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Right Side Connection -->
    <line x1="672" y1="222" x2="690" y2="224" stroke="url(#roseGoldWire)" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
