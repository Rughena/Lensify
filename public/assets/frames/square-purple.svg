<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <!-- Metallic Lavender Purple Wire Gradient -->
    <linearGradient id="metalPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9d7bb0"/>
      <stop offset="35%" stop-color="#cbb0db"/>
      <stop offset="70%" stop-color="#7a558f"/>
      <stop offset="100%" stop-color="#b695c9"/>
    </linearGradient>

    <!-- Translucent Purple Acrylic Tip Gradient -->
    <linearGradient id="translucentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e1bbf5" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a468cf" stop-opacity="0.75"/>
    </linearGradient>

    <!-- Glitter/Sparkle Texture Effect Pattern for Temple Corners -->
    <pattern id="glitterPattern" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#a382b8"/>
      <circle cx="1" cy="1" r="0.7" fill="#ffffff"/>
      <circle cx="3" cy="3" r="0.5" fill="#fdf3ff"/>
      <circle cx="3" cy="1" r="0.4" fill="#694180"/>
    </pattern>
  </defs>

  <!-- BACKGROUND RECT (Transparent) -->
  <rect width="100%" height="100%" fill="none"/>

  <!-- MAIN EYEWEAR CHASSIS GROUP -->
  <g transform="translate(0, 20)">
    
    <!-- LIGHTWEIGHT METALLIC TEMPLES (EXTENDING BACKWARD) -->
    <!-- Left Temple Wire & Acrylic Sleeve -->
    <g id="leftTemple">
      <path d="M 125 170 Q 75 165, 45 190" fill="none" stroke="url(#metalPurple)" stroke-width="2.5"/>
      <path d="M 65 167 C 55 172, 42 185, 40 195 C 38 200, 44 204, 48 198 C 54 190, 62 180, 70 174 Z" fill="url(#translucentPurple)"/>
    </g>
    <!-- Right Temple Wire & Acrylic Sleeve -->
    <g id="rightTemple">
      <path d="M 675 170 Q 725 165, 755 190" fill="none" stroke="url(#metalPurple)" stroke-width="2.5"/>
      <path d="M 735 167 C 745 172, 758 185, 760 195 C 762 200, 756 204, 752 198 C 746 190, 738 180, 730 174 Z" fill="url(#translucentPurple)"/>
    </g>

    <!-- SLENDER METALLIC NOSE BRIDGE -->
    <path d="M 365 185 C 380 172, 420 172, 435 185" fill="none" stroke="url(#metalPurple)" stroke-width="3" stroke-linecap="round"/>

    <!-- LEFT SOFT GEOMETRIC SQUARE LENS RIM -->
    <g id="leftRim">
      <!-- Rounded Square Outer Metal Profile -->
      <path d="
        M 365,190 
        C 365,150 330,135 255,135
        H 185
        C 145,135 125,155 125,195
        V 240
        C 125,280, 150,305, 190,305
        H 260
        C 305,305, 365,290, 365,240
        Z" 
        fill="none" 
        stroke="url(#metalPurple)" 
        stroke-width="3.5" 
        stroke-linejoin="round"
      />
      <!-- Lens Cavity (Completely Transparent) -->
      <path d="M 365,190 C 365,150 330,135 255,135 H 185 C 145,135 125,155 125,195 V 240 C 125,280, 150,305, 190,305 H 260 C 305,305, 365,290, 365,240 Z" fill="none"/>
      <!-- Soft Glare Lines on Clear Glass -->
      <line x1="160" y1="165" x2="220" y2="225" stroke="#ffffff" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
      <line x1="180" y1="165" x2="210" y2="195" stroke="#ffffff" stroke-width="1" opacity="0.2" stroke-linecap="round"/>
    </g>

    <!-- RIGHT SOFT GEOMETRIC SQUARE LENS RIM -->
    <g id="rightRim">
      <!-- Rounded Square Outer Metal Profile -->
      <path d="
        M 435,190 
        C 435,150 470,135 545,135
        H 615
        C 655,135 675,155 675,195
        V 240
        C 675,280, 650,305, 610,305
        H 540
        C 495,305, 435,290, 435,240
        Z" 
        fill="none" 
        stroke="url(#metalPurple)" 
        stroke-width="3.5" 
        stroke-linejoin="round"
      />
      <!-- Lens Cavity (Completely Transparent) -->
      <path d="M 435,190 C 435,150 470,135 545,135 H 615 C 655,135 675,155 675,195 V 240 C 675,280, 650,305, 610,305 H 540 C 495,305, 435,290, 435,240 Z" fill="none"/>
      <!-- Soft Glare Lines on Clear Glass -->
      <line x1="640" y1="165" x2="580" y2="225" stroke="#ffffff" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
      <line x1="620" y1="165" x2="590" y2="195" stroke="#ffffff" stroke-width="1" opacity="0.2" stroke-linecap="round"/>
    </g>

    <!-- GLITTER/SPARKLE TEXTURED HINGE CORNER ACCENTS -->
    <!-- Textured Endpieces at the Top-Outer Wings -->
    <rect x="117" y="155" width="10" height="24" rx="4" transform="rotate(-15, 117, 155)" fill="url(#glitterPattern)" stroke="#694180" stroke-width="0.5"/>
    <rect x="673" y="155" width="10" height="24" rx="4" transform="rotate(15, 673, 155)" fill="url(#glitterPattern)" stroke="#694180" stroke-width="0.5"/>

    <!-- MINIMALIST SILICONE NOSE PADS -->
    <g opacity="0.7">
      <ellipse cx="350" cy="215" rx="5" ry="9" fill="#ffffff" stroke="#cbb0db" stroke-width="1"/>
      <ellipse cx="450" cy="215" rx="5" ry="9" fill="#ffffff" stroke="#cbb0db" stroke-width="1"/>
    </g>
  </g>
</svg>
