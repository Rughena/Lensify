    <path d="M 660 212 C 695 220, 720 240, 730 255" fill="none" stroke="url(#silverMetallic)" stroke-width="2" stroke-linecap="round"/>

    <path d="M 374 205 C 388 194, 412 194, 426 205" fill="none" stroke="url(#silverMetallic)" stroke-width="3.5" stroke-linecap="round"/>

    <g id="leftEye">
      <path d="
