      <stop offset="30%" stop-color="#2ca1b0"/>
      <stop offset="70%" stop-color="#54e2ec"/>
      <stop offset="100%" stop-color="#a6f7fd"/>
    </linearGradient>
    
    <linearGradient id="skyReflection" x1="0%" y1="0%" x2="100%" y2="100%">
