<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="silverMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d0d7de"/>
      <stop offset="25%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#a2aab2"/>
      <stop offset="75%" stop-color="#f1f3f5"/>
      <stop offset="100%" stop-color="#78828c"/>
    </linearGradient>

    <linearGradient id="aquaMirror" x1="0%" y1="100%" x2="100%" y2="0%">
