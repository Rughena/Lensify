    <ellipse cx="364" cy="245" rx="3.5" ry="7" fill="#ffffff" fill-opacity="0.5" stroke="url(#silverMetallic)" stroke-width="1" transform="rotate(-15, 364, 245)"/>
    <ellipse cx="436" cy="245" rx="3.5" ry="7" fill="#ffffff" fill-opacity="0.5" stroke="url(#silverMetallic)" stroke-width="1" transform="rotate(15, 436, 245)"/>

    <line x1="142" y1="215" x2="124" y2="215" stroke="url(#silverMetallic)" stroke-width="3" stroke-linecap="round"/>
    <line x1="658" y1="215" x2="676" y2="215" stroke="url(#silverMetallic)" stroke-width="3" stroke-linecap="round"/>
