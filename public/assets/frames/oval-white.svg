<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <!-- Polished Glossy White Acetate Gradient -->
    <linearGradient id="glossyWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f4f4f6"/>
      <stop offset="100%" stop-color="#e2e2e6"/>
    </linearGradient>

    <!-- Deep Midnight Sun Tint for Lenses -->
    <linearGradient id="darkSunTint" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1b1f"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <!-- Sleek Studio Glare Reflection Overlay -->
    <linearGradient id="studioGlare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft Inner 3D Rim Shadow -->
    <linearGradient id="rimShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ccccd0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background (Optional / Transparent for digital try-on) -->
  <rect width="100%" height="100%" fill="none"/>

  <!-- MAIN RETRO OVAL EYEWEAR GROUP -->
  <g transform="translate(0, 10)">
    
    <!-- MATCHING WHITE TEMPLES (ARMS) EXTENDING BACKWARD -->
    <path d="M 125 155 Q 85 140, 40 135 C 35 140, 36 146, 42 150 Q 85 158, 120 176 Z" fill="#e2e2e6" stroke="#d2d2d6" stroke-width="1"/>
    <path d="M 675 155 Q 715 140, 760 135 C 765 140, 764 146, 758 150 Q 715 158, 680 176 Z" fill="#e2e2e6" stroke="#d2d2d6" stroke-width="1"/>

    <!-- SOLID UNIFIED RETRO CLOUT CHASSIS -->
    <!-- Formed as a smooth singular curve layout to eliminate any bra-like separation -->
    <path d="
      M 400,165 
      C 375,165 355,142 330,135
      C 265,115 185,115 132,142
      C 95,160 90,205 110,232
      C 138,270 205,285 268,285
      C 328,285 365,255 382,225
      C 390,210 394,202 400,202
      C 406,202 410,210 418,225
      C 435,255 472,285 532,285
      C 595,285 662,270 690,232
      C 710,205 705,160 668,142
      C 615,115 535,115 470,135
      C 445,142 425,165 400,165 Z" 
      fill="url(#glossyWhite)" 
      stroke="#c2c2c6" 
      stroke-width="1.5"
    />

    <!-- 3D ACRYLIC BEVEL EDGE HIGHLIGHTS -->
    <path d="M 142,136 C 215,112 315,124 346,146" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <path d="M 658,136 C 585,112 485,124 454,146" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9"/>

    <!-- LEFT PERFECT RETRO OVAL LENS -->
    <g id="leftOvalLens">
      <!-- Base Dark Tint Cutout -->
      <ellipse cx="236" cy="198" rx="72" ry="52" fill="url(#darkSunTint)"/>
      <!-- Softbox Light Glare Reflection -->
      <ellipse cx="236" cy="198" rx="72" ry="52" fill="url(#studioGlare)"/>
      <!-- Inner Beveled Shadow Rim -->
      <ellipse cx="236" cy="198" rx="72" ry="52" fill="none" stroke="url(#rimShadow)" stroke-width="3.5"/>
    </g>

    <!-- RIGHT PERFECT RETRO OVAL LENS -->
    <g id="rightOvalLens">
      <!-- Base Dark Tint Cutout -->
      <ellipse cx="564" cy="198" rx="72" ry="52" fill="url(#darkSunTint)"/>
      <!-- Softbox Light Glare Reflection -->
      <ellipse cx="564" cy="198" rx="72" ry="52" fill="url(#studioGlare)"/>
      <!-- Inner Beveled Shadow Rim -->
      <ellipse cx="564" cy="198" rx="72" ry="52" fill="none" stroke="url(#rimShadow)" stroke-width="3.5"/>
    </g>

    <!-- SMOOTH INTEGRATED NOSE BRIDGE HIGHLIGHTS -->
    <path d="M 352,190 C 358,202 364,212 372,216" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M 448,190 C 442,202 436,212 428,216" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
