<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="havanaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfba6b"/>
      <stop offset="30%" stop-color="#fbf4cc"/>
      <stop offset="60%" stop-color="#cda043"/>
      <stop offset="100%" stop-color="#916c22"/>
    </linearGradient>

    <linearGradient id="havanaLens" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2c"/>
      <stop offset="50%" stop-color="#1b1b1c"/>
      <stop offset="100%" stop-color="#0f0f10"/>
    </linearGradient>

    <linearGradient id="sunglassGlare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g transform="translate(0, 15)">
    <path d="M 125 212 C 170 220, 200 245, 230 275" fill="none" stroke="#806226" stroke-width="2"/>
    <path d="M 675 212 C 630 220, 600 245, 570 275" fill="none" stroke="#806226" stroke-width="2"/>

    <path d="M 374 212 C 388 205, 412 205, 426 212" fill="none" stroke="url(#havanaGold)" stroke-width="3.5" stroke-linecap="round"/>

    <g id="leftHex">
      <polygon points="175,170 315,166 360,205 345,264 215,274 140,230" fill="url(#havanaLens)"/>
      <polygon points="175,170 315,166 360,205 345,264 215,274 140,230" fill="url(#sunglassGlare)"/>
      <polygon points="175,170 315,166 360,205 345,264 215,274 140,230" fill="none" stroke="url(#havanaGold)" stroke-width="3" stroke-linejoin="round"/>
    </g>

    <g id="rightHex">
      <polygon points="625,170 485,166 440,205 455,264 585,274 660,230" fill="url(#havanaLens)"/>
      <polygon points="625,170 485,166 440,205 455,264 585,274 660,230" fill="url(#sunglassGlare)"/>
      <polygon points="625,170 485,166 440,205 455,264 585,274 660,230" fill="none" stroke="url(#havanaGold)" stroke-width="3" stroke-linejoin="round"/>
    </g>

    <ellipse cx="363" cy="242" rx="4" ry="8" fill="#ffffff" fill-opacity="0.4" stroke="url(#havanaGold)" stroke-width="1" transform="rotate(-10, 363, 242)"/>
    <ellipse cx="437" cy="242" rx="4" ry="8" fill="#ffffff" fill-opacity="0.4" stroke="url(#havanaGold)" stroke-width="1" transform="rotate(10, 437, 242)"/>

    <path d="M 140 212 L 116 212 M 116 209 L 116 215" fill="none" stroke="url(#havanaGold)" stroke-width="2.5"/>
    <path d="M 660 212 L 684 212 M 684 209 L 684 215" fill="none" stroke="url(#havanaGold)" stroke-width="2.5"/>
  </g>
