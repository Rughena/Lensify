<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Deep glossy black acetate frame gradient -->
    <linearGradient id="retroBlackAcetate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#222224"/>
      <stop offset="30%" stop-color="#0f0f10"/>
      <stop offset="70%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Balanced dark smoke lens gradient -->
    <linearGradient id="ovalSmokeLens" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d2f33"/>
      <stop offset="50%" stop-color="#1e1f22"/>
      <stop offset="100%" stop-color="#111214"/>
    </linearGradient>

    <!-- Translucent matte light reflection for the curved lenses -->
    <linearGradient id="lensSoftGlare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background (Optional/Transparent) -->
  <rect width="100%" height="100%" fill="none"/>

  <g transform="translate(0, 30)">
    <!-- TEMPLES / ARMS (Background layer) -->
    <!-- Left Temple (Thick silhouette, visible below the frame) -->
    <path d="M 160 215 C 135 235, 115 252, 102 262 C 96 266, 102 274, 108 268 C 122 254, 142 234, 168 218 Z" fill="#08080a"/>
    <!-- Right Temple (Slightly tilted down out the edge) -->
    <path d="M 640 215 C 665 235, 685 252, 698 262 C 704 266, 698 274, 692 268 C 678 254, 658 234, 632 218 Z" fill="#08080a"/>

    <!-- MAIN THICK OVAL FRAME (Includes bridge & thick chassis) -->
    <path d="
      M 160 145 
      C 270 142, 345 168, 372 182 
      C 386 189, 414 189, 428 182 
      C 455 168, 530 142, 640 145
      C 710 147, 735 180, 735 215
      C 735 250, 705 278, 630 282
      C 550 286, 465 268, 440 216
      C 432 200, 368 200, 360 216
      C 335 268, 250 286, 170 282
      C 95 278, 65 250, 65 215
      C 65 180, 90 147, 160 145 Z" 
      fill="url(#retroBlackAcetate)"
    />

    <!-- LEFT OVAL LENS -->
    <g id="leftOval">
      <!-- Lens Shape -->
      <path d="
        M 170 168
        C 255 164, 325 174, 345 200
        C 360 220, 345 254, 310 262
        C 250 268, 160 260, 130 240
        C 112 228, 115 178, 170 168 Z" 
        fill="url(#ovalSmokeLens)"
      />
      <!-- Lens Soft Glare -->
      <path d="
        M 170 168
        C 255 164, 325 174, 345 200
        C 360 220, 345 254, 310 262
        C 250 268, 160 260, 130 240
        C 112 228, 115 178, 170 168 Z" 
        fill="url(#lensSoftGlare)"
      />
    </g>

    <!-- RIGHT OVAL LENS -->
    <g id="rightOval">
      <!-- Lens Shape (Mirrored) -->
      <path d="
        M 630 168
        C 545 164, 475 174, 455 200
        C 440 220, 455 254, 490 262
        C 550 268, 640 260, 670 240
        C 688 228, 685 178, 630 168 Z" 
        fill="url(#ovalSmokeLens)"
      />
      <!-- Lens Soft Glare -->
      <path d="
        M 630 168
        C 545 164, 475 174, 455 200
        C 440 220, 455 254, 490 262
        C 550 268, 640 260, 670 240
        C 688 228, 685 178, 630 168 Z" 
        fill="url(#lensSoftGlare)"
      />
    </g>
  </g>
</svg>
