<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <!-- Polished Executive Silver Chrome Gradient -->
    <linearGradient id="polishedSilver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="25%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="75%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Deep Ocean Sea-Blue/Dark Tint Layered Lens Gradient -->
    <linearGradient id="oceanBlueTint" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111e2e"/>
      <stop offset="40%" stop-color="#0f2537"/>
      <stop offset="100%" stop-color="#070d14"/>
    </linearGradient>

    <!-- Linear Mirror Studio Highlight -->
    <linearGradient id="skyGlare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- BACKGROUND RECT (Transparent for Overlay UI) -->
  <rect width="100%" height="100%" fill="none"/>

  <!-- MAIN NAVIGATOR FRAME GROUP -->
  <g transform="translate(0, 15)">
    
    <!-- SLENDER METALLIC TEMPLES & BLACK EAR SLEEVES -->
    <!-- Left Temple Wire & Grip -->
    <g id="leftArm">
      <path d="M 120,165 Q 70,150, 45,180" fill="none" stroke="url(#polishedSilver)" stroke-width="2.5"/>
      <path d="M 65,157 C 52,162, 40,175, 38,185 C 36,192, 42,195, 45,190 Q 55,175, 70,165 Z" fill="#1e293b"/>
    </g>
    <!-- Right Temple Wire & Grip -->
    <g id="rightArm">
      <path d="M 680,165 Q 730,150, 755,180" fill="none" stroke="url(#polishedSilver)" stroke-width="2.5"/>
      <path d="M 735,157 C 748,162, 760,175, 762,185 C 764,192, 758,195, 755,190 Q 745,175, 730,165 Z" fill="#1e293b"/>
    </g>

    <!-- TRADITIONAL DOUBLE AVIATOR BROW BARS -->
    <!-- Upper Stabilizer Bar -->
    <path d="M 345,147 C 365,143, 435,143, 455,147" fill="none" stroke="url(#polishedSilver)" stroke-width="3" stroke-linecap="round"/>
    <!-- Lower Curved Bridge Support -->
    <path d="M 338,172 C 360,166, 440,166, 462,172" fill="none" stroke="url(#polishedSilver)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- LEFT SQUARE-AVIATOR NAVIGATOR RIM -->
    <g id="leftEyeWire">
      <!-- High-Precision Thin Metal Rim Profile -->
      <path d="
        M 338,170 
        C 338,145, 305,138, 240,138 
        H 165 
        C 130,138, 118,155, 118,185 
        V 220 
        C 118,265, 140,288, 185,288 
        H 250 
        C 305,288, 338,265, 338,215 
        Z" 
        fill="none" 
        stroke="url(#polishedSilver)" 
        stroke-width="3.5" 
        stroke-linejoin="round"
      />
      <!-- Polarized Blue Lens Insert -->
      <path d="M 338,170 C 338,145, 305,138, 240,138 H 165 C 130,138, 118,155, 118,185 V 220 C 118,265, 140,288, 185,288 H 250 C 305,288, 338,265, 338,215 Z" fill="url(#oceanBlueTint)"/>
      <path d="M 338,170 C 338,145, 305,138, 240,138 H 165 C 130,138, 118,155, 118,185 V 220 C 118,265, 140,288, 185,288 H 250 C 305,288, 338,265, 338,215 Z" fill="url(#skyGlare)"/>
      <!-- Soft Light Cut Reflection Stripe -->
      <path d="M 135,150 Q 210,230, 310,255" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.2" stroke-linecap="round"/>
    </g>

    <!-- RIGHT SQUARE-AVIATOR NAVIGATOR RIM -->
    <g id="rightEyeWire">
      <!-- High-Precision Thin Metal Rim Profile -->
      <path d="
        M 462,170 
        C 462,145, 495,138, 560,138 
        H 635 
        C 670,138, 682,155, 682,185 
        V 220 
        C 682,265, 660,288, 615,288 
        H 550 
        C 495,288, 462,265, 462,215 
        Z" 
        fill="none" 
        stroke="url(#polishedSilver)" 
        stroke-width="3.5" 
        stroke-linejoin="round"
      />
      <!-- Polarized Blue Lens Insert -->
      <path d="M 462,170 C 462,145, 495,138, 560,138 H 635 C 670,138, 682,155, 682,185 V 220 C 682,265, 660,288, 615,288 H 550 C 495,288, 462,265, 462,215 Z" fill="url(#oceanBlueTint)"/>
      <path d="M 462,170 C 462,145, 495,138, 560,138 H 635 C 670,138, 682,155, 682,185 V 220 C 682,265, 660,288, 615,288 H 550 C 495,288, 462,265, 462,215 Z" fill="url(#skyGlare)"/>
      <!-- Soft Light Cut Reflection Stripe -->
      <path d="M 665,150 Q 590,230, 490,255" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.2" stroke-linecap="round"/>
    </g>

    <!-- INDUSTRIAL MECHANICAL HINGE RIVETS -->
    <circle cx="123" cy="165" r="1.5" fill="#475569"/>
    <circle cx="677" cy="165" r="1.5" fill="#475569"/>

    <!-- TRANSLUCENT COMFORT SILICONE NOSE PADS -->
    <g opacity="0.6">
      <ellipse cx="326" cy="202" rx="4" ry="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <ellipse cx="474" cy="202" rx="4" ry="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    </g>
  </g>
</svg>
